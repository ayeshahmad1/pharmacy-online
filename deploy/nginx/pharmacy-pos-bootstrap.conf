# Temporary HTTP-only site used once, to obtain the first Let's Encrypt
# certificate before pharmacy-pos.conf (which needs the certificate files) can
# load. Install as /etc/nginx/sites-available/pharmacy-pos, run certbot, then
# replace it with pharmacy-pos.conf (README: "Nginx and HTTPS").

server {
    listen 80;
    listen [::]:80;
    server_name pos.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 404;
    }
}
