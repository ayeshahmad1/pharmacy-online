# Security headers for the web app's static files. Install as
# /etc/nginx/snippets/pharmacy-pos-headers.conf. (API responses get theirs
# from helmet in the API.) Included in each static location because nginx
# drops server-level add_header lines in any location that has its own.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Scripts only from this origin (no inline, no eval); the app calls only its
# own /api. Inline styles are allowed because the UI and charts set style
# attributes. If you enable Sentry in the browser, add its ingest host to
# connect-src, e.g. https://o123.ingest.sentry.io.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
