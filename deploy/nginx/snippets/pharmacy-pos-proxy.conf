# Proxy settings for the API locations. Install as /etc/nginx/snippets/pharmacy-pos-proxy.conf.
# The API trusts X-Forwarded-* only from loopback (TRUST_PROXY=loopback), and
# every one of them is overwritten here, so a client cannot inject its own.

proxy_pass http://pharmacy_api;
proxy_http_version 1.1;
proxy_set_header Connection "";

# Host as the browser sent it: the API compares it with the Origin header.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
# The client address only (not appended to a client-supplied list).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
