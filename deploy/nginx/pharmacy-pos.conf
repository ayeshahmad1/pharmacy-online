# Nginx site for the Pharmacy POS. Install as /etc/nginx/sites-available/pharmacy-pos
# after replacing every pos.example.com with your domain (README: "Nginx and HTTPS").
#
# Serves the built web app from the current release and proxies /api to the
# API on 127.0.0.1:4000, all on one HTTPS origin (the refresh cookie is
# SameSite=Strict and the API refuses other origins).

# Per-IP request limits in front of the API's own. The tills share the
# pharmacy's public IP, so these are generous; the login limit is tighter.
limit_req_zone $binary_remote_addr zone=pharmacy_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pharmacy_login:10m rate=10r/m;
limit_req_status 429;

upstream pharmacy_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

# Anything not addressed to our domain (IP scans, other Host headers) is dropped.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
    server_name _;
    return 444;
}

# Plain HTTP: only Let's Encrypt challenges, everything else goes to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name pos.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "listen ... http2" works on Ubuntu 24.04's nginx 1.24; on 1.25+ it still works (with a
    # deprecation notice), or switch to "listen 443 ssl;" plus "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pos.example.com;

    ssl_certificate /etc/letsencrypt/live/pos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:pharmacy_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    root /opt/pharmacy-pos/current/apps/web/dist;
    index index.html;

    # Input limits. The API itself refuses JSON bodies over 100 kB.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    large_client_header_buffers 4 16k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml
        application/manifest+json text/csv;

    # ── API ──
    location /api/ {
        limit_req zone=pharmacy_api burst=100 nodelay;
        include /etc/nginx/snippets/pharmacy-pos-proxy.conf;
    }
    location = /api/auth/login {
        limit_req zone=pharmacy_login burst=10 nodelay;
        include /etc/nginx/snippets/pharmacy-pos-proxy.conf;
    }

    # ── Web app ──
    # Hashed build output never changes under the same name.
    location /assets/ {
        include /etc/nginx/snippets/pharmacy-pos-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # The entry page, service worker and manifest must be revalidated on every
    # load, or tills would never see an update.
    location = /index.html {
        include /etc/nginx/snippets/pharmacy-pos-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        include /etc/nginx/snippets/pharmacy-pos-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    # Everything else: real files (icons, manifest), or the app for client-side routes.
    location / {
        include /etc/nginx/snippets/pharmacy-pos-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
